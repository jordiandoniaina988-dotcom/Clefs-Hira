<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<meta name="description" content="Liste des clés des chants Hira, en lecture ou en édition.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cléfs Hira">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:Montserrat;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/montserrat.woff2) format("woff2")}</style>
<title>Cléfs Hira</title>
<style>
:root{--sans:Montserrat,'Helvetica Neue',Helvetica,Arial,sans-serif;--serif:var(--sans);--bg:#f5f6f8;--card:#fff;--ink:#14161a;--mut:#6b7280;--line:#e8eaee;--acc:#1b5cff;--accsoft:#e8efff;--danger:#e5384a;
--DO:#e5384a;--RE:#f08a1c;--MI:#e6b800;--FA:#1faa59;--SO:#1b8fff;--LA:#6d4aff;--SI:#d6409f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--card:#17191e;--ink:#f2f3f5;--mut:#9aa1ad;--line:#262930;--acc:#5b8cff;--accsoft:#1c2745}}
:root[data-theme="dark"]{--bg:#0e0f12;--card:#17191e;--ink:#f2f3f5;--mut:#9aa1ad;--line:#262930;--acc:#5b8cff;--accsoft:#1c2745}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;max-width:640px;margin:0 auto;padding-bottom:130px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:46px 22px 14px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--serif);font-size:26px;margin:0;letter-spacing:-.3px}
h1 small{display:block;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.seg{display:flex;background:var(--line);border-radius:999px;padding:3px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--mut);font:600 13px var(--sans);padding:8px 14px;border-radius:999px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.search{margin-top:20px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.search input{flex:1;border:0;background:none;color:var(--ink);font:500 16px var(--sans);padding:16px 0;outline:0;min-width:0}
.chips{display:flex;gap:10px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px var(--sans);padding:9px 16px;border-radius:999px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.banner{display:flex;align-items:center;gap:8px;margin:18px 22px 0;padding:14px 18px;border-radius:12px;background:var(--accsoft);color:var(--acc);font:600 13px var(--sans)}
.count{padding:28px 28px 14px;font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.list{margin:0 22px;background:var(--card);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:18px;padding:20px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.row:active{background:var(--accsoft)}
.num{font:700 22px var(--serif);min-width:48px;text-align:center}
.tit{flex:1;font:600 15px/1.45 var(--sans);min-width:0;overflow-wrap:anywhere}
.tit em{display:block;font:500 12px var(--sans);color:var(--mut);font-style:normal;margin-top:2px}
.key{font:800 14px var(--sans);color:#fff;padding:7px 0;width:50px;text-align:center;border-radius:11px;letter-spacing:.04em}
.key.SO,.key.MI{} .key.MI{color:#2a2200}
.key[data-k=""],.big .k[data-k=""]{background:var(--line);color:var(--mut)}
[data-k=DO]{background:var(--DO)}[data-k=RE]{background:var(--RE)}[data-k=MI]{background:var(--MI)}[data-k=FA]{background:var(--FA)}[data-k=SO]{background:var(--SO)}[data-k=LA]{background:var(--LA)}[data-k=SI]{background:var(--SI)}
[data-k="DO#"]{background:#a81f2a}[data-k="RE#"]{background:#b85a08}[data-k="FA#"]{background:#117a45}[data-k="SO#"]{background:#1060b8}[data-k="LA#"]{background:#4429b8}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.empty{padding:40px 20px;text-align:center;color:var(--mut);font-weight:500}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:6}
.fab button{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;font:700 15px var(--sans);padding:15px 20px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.f1{background:var(--acc);color:#fff}.f2{background:var(--card);color:var(--ink);border:1px solid var(--line)!important}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:26px 26px calc(32px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 24px}
.sheet h2{font:700 22px var(--serif);margin:0 0 24px}
label{display:block;font:600 12px var(--sans);color:var(--mut);margin:22px 0 10px;letter-spacing:.06em;text-transform:uppercase}
.in,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:13px;font:500 16px var(--sans);outline:0}
textarea{min-height:200px;font:500 13px ui-monospace,monospace}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.keys button{border:2px solid transparent;color:#fff;font:800 13px var(--sans);padding:12px 0;border-radius:11px;opacity:.4}
.keys button.on{opacity:1;border-color:var(--ink);transform:scale(1.05)}
.keys button[data-k=MI]{color:#2a2200}
.btns{display:flex;gap:12px;margin-top:32px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:14px;font:700 15px var(--sans);background:var(--line);color:var(--ink)}
.btn.p{background:var(--acc);color:#fff}.btn.d{background:var(--danger);color:#fff}
.big{text-align:center;padding:24px 0 12px}
.big .n{font:700 20px var(--serif);color:var(--mut)}
.big .t{font:700 22px/1.25 var(--sans);margin:6px 0 20px}
.big .k{display:inline-block;font:800 84px var(--sans);color:#fff;padding:18px 40px;border-radius:28px;letter-spacing:.02em}
.big .k[data-k=MI]{color:#2a2200}
.msg{font:500 13px var(--sans);color:var(--mut);margin-top:8px}
[data-k=""]{--c:var(--mut)}[data-k=C]{--c:#f43f5e}[data-k="C#"]{--c:#ff6b4a}[data-k=D]{--c:#f97316}[data-k="D#"]{--c:#f59e0b}[data-k=E]{--c:#d9a400}[data-k=F]{--c:#10b981}[data-k="F#"]{--c:#14b8a6}[data-k=G]{--c:#0ea5e9}[data-k="G#"]{--c:#3b82f6}[data-k=A]{--c:#6366f1}[data-k="A#"]{--c:#8b5cf6}[data-k=B]{--c:#d946ef}
.key[data-k],.big .k[data-k]{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.keys button[data-k]{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);opacity:1}
.keys button[data-k].on{background:var(--c);color:#fff;border-color:transparent;transform:scale(1.04)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><small>Fihirana Pentekotista</small>Cléfs Hira</h1>
    <div class="seg" id="seg"></div>
  </div>
  <div class="search"><span id="sic" style="color:var(--mut);display:flex"></span><input id="q" type="search" inputmode="search" placeholder="Numéro ou titre…" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
</header>
<div id="banner"></div>
<div class="count" id="count"></div>
<div class="list" id="list"></div>
<div class="fab" id="fab"></div>
<div id="modal"></div>
<script>
var KEYS=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],SOL={DO:"C","DO#":"C#",RE:"D","RE#":"D#",MI:"E",FA:"F","FA#":"F#",SO:"G","SO#":"G#",LA:"A","LA#":"A#",SI:"B"},LS="clefs-hira-v1";
var SEED=[{n:124,t:"Nivavaka ibery Jesosy",k:"DO"},{n:148,t:"Aza kosekinao ny anarako",k:"FA"},{n:284,t:"Vonjeo i Madagasikara",k:"MI"},{n:289,t:"Courage",k:"SO"}];
var S={items:[],mode:"read",q:"",key:"",book:""};
function load(){var v=0;try{var r=localStorage.getItem(LS);if(r){var d=JSON.parse(r);S.items=d.items||[];S.mode=d.mode||"read";v=d.v||0}}catch(e){}if(!S.items.length)S.items=SEED.slice();S.items.forEach(function(i){i.k=SOL[i.k]||i.k});if(v<2){for(var n=1;n<=321;n++)if(!find(n))S.items.push({n:n,t:"",k:""});save()}}
function save(){try{localStorage.setItem(LS,JSON.stringify({v:2,items:S.items,mode:S.mode}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function book(n){return n<=150?"Amboanjobe":"Pentekotista"}
var P={search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',swap:'<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',check:'<path d="M20 6 9 17l-5-5"/>',book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',chev:'<path d="m9 18 6-6-6-6"/>'};
function ic(n,s){return'<svg class="ic" viewBox="0 0 24 24"'+(s?' style="width:'+s+'px;height:'+s+'px"':'')+'>'+P[n]+'</svg>'}
function $(i){return document.getElementById(i)}
function render(){
  $("seg").innerHTML='<button data-m="read" class="'+(S.mode==="read"?"on":"")+'">'+ic("book",16)+'Lecture</button><button data-m="edit" class="'+(S.mode==="edit"?"on":"")+'">'+ic("pencil",16)+'Édition</button>';
  var ch='<button class="chip'+(!S.key&&!S.book?' on':'')+'" data-a="all">Tous</button>';
  
  KEYS.forEach(function(k){ch+='<button class="chip'+(S.key===k?' on':'')+'" data-key="'+k+'">'+k+'</button>'});
  $("chips").innerHTML=ch;
  var q=S.q.trim().toLowerCase();
  var L=S.items.filter(function(i){return(!S.key||i.k===S.key)&&(!S.book||book(i.n)===S.book)&&(!q||String(i.n)===q||String(i.n).indexOf(q)===0||i.t.toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return a.n-b.n});
  $("count").textContent=L.length+" chant"+(L.length>1?"s":"");
  $("banner").innerHTML=S.mode==="edit"?'<div class="banner">'+ic("pencil",16)+'Mode édition : touchez un chant pour le modifier ou le supprimer.</div>':"";
  $("list").innerHTML=L.length?L.map(function(i){return'<div class="row" data-n="'+i.n+'"><div class="num">'+i.n+'</div><div class="tit">'+(i.t?esc(i.t):'<span style="color:var(--mut)">Sans titre</span>')+'</div><div class="key" data-k="'+i.k+'">'+(i.k||"—")+'</div><span style="color:var(--mut);display:flex">'+ic(S.mode==="edit"?"pencil":"chev",18)+'</span></div>'}).join(""):'<div class="empty">Aucun chant trouvé.'+(S.mode==="edit"?'<br>Touchez « + Chant » pour en ajouter.':'')+'</div>';
  $("fab").innerHTML=S.mode==="edit"?'<button class="f2" data-a="io">'+ic("swap",18)+'Import</button><button class="f1" data-a="add">'+ic("plus",18)+'Chant</button>':"";
}
function sheet(h){$("modal").innerHTML='<div class="veil" data-a="close"><div class="sheet"><div class="grab"></div>'+h+'</div></div>'}
function close(){$("modal").innerHTML=""}
function find(n){return S.items.filter(function(i){return i.n===n})[0]}
function readView(n){var i=find(n);sheet('<div class="big"><div class="n">N° '+i.n+'</div><div class="t">'+esc(i.t||"")+'</div><div class="k" data-k="'+i.k+'">'+(i.k||"—")+'</div></div><div class="btns"><button class="btn" data-a="close">'+ic("x",18)+'Fermer</button></div>')}
var F={};
function form(orig){
  F={orig:orig,n:orig?orig.n:"",t:orig?orig.t:"",k:orig?orig.k:"C",del:0};drawForm("");
}
function drawForm(err){
  sheet('<h2>'+(F.orig?"Modifier le chant":"Nouveau chant")+'</h2><label>Numéro</label><input class="in" id="fn" type="number" inputmode="numeric" min="1" value="'+F.n+'"><label>Titre</label><input class="in" id="ft" value="'+esc(F.t)+'" placeholder="Titre du chant"><label>Clé</label><div class="keys">'+KEYS.map(function(k){return'<button data-k="'+k+'" data-pk="'+k+'" class="'+(F.k===k?"on":"")+'">'+k+'</button>'}).join("")+'</div><div class="msg" style="color:var(--danger)">'+err+'</div><div class="btns">'+(F.orig?'<button class="btn d" data-a="del">'+ic("trash",18)+(F.del?"Confirmer":"Supprimer")+'</button>':'')+'<button class="btn p" data-a="saveone">'+ic("check",18)+'Enregistrer</button></div>');
}
function keep(){var a=$("fn"),b=$("ft");if(a){F.n=a.value;F.t=b.value}}
function ioView(){
  sheet('<h2>Importer / Exporter</h2><div class="msg" style="margin:0 0 8px">Une ligne par chant : <b>numéro titre clé</b> (ex. <i>125 Jesosy ho anao F</i>). Les numéros existants sont remplacés.</div><textarea id="bulk">'+esc(S.items.slice().sort(function(a,b){return a.n-b.n}).map(function(i){return i.n+" "+i.t+" "+i.k}).join("\n"))+'</textarea><div class="msg" id="iom"></div><div class="btns"><button class="btn" data-a="copy">'+ic("copy",18)+'Copier</button><button class="btn p" data-a="imp">'+ic("swap",18)+'Importer</button></div>');
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a],[data-m],[data-b],[data-key],[data-pk],.row,.sheet");if(!t)return;
  var d=t.dataset;
  if(t.classList.contains("sheet")&&!d.a)return;
  if(d.m){S.mode=d.m;save();render();return}
  if(d.b){S.book=S.book===d.b?"":d.b;render();return}
  if(d.key){S.key=S.key===d.key?"":d.key;render();return}
  if(d.pk){keep();F.k=d.pk;drawForm("");return}
  if(t.classList.contains("row")){var n=+d.n;S.mode==="edit"?form(find(n)):readView(n);return}
  var a=d.a;
  if(a==="all"){S.key="";S.book="";render()}
  else if(a==="close"){if(e.target===t||t.classList.contains("btn"))close()}
  else if(a==="add")form(null);
  else if(a==="io")ioView();
  else if(a==="del"){keep();if(!F.del){F.del=1;drawForm("")}else{S.items=S.items.filter(function(i){return i!==F.orig});save();close();render()}}
  else if(a==="saveone"){keep();var n=parseInt(F.n,10);if(!(n>0)){drawForm("Entrez un numéro valide.");return}
    var ex=find(n);if(ex&&ex!==F.orig){drawForm("Le numéro "+n+" existe déjà.");return}
    var rec={n:n,t:F.t.trim(),k:F.k};if(F.orig){S.items[S.items.indexOf(F.orig)]=rec}else S.items.push(rec);save();close();render()}
  else if(a==="copy"){var v=$("bulk").value;try{navigator.clipboard.writeText(v).then(function(){$("iom").textContent="Copié dans le presse-papiers."},function(){$("bulk").select();$("iom").textContent="Sélectionné : copiez manuellement."})}catch(x){$("bulk").select();$("iom").textContent="Sélectionné : copiez manuellement."}}
  else if(a==="imp"){var c=0,re=/^(\d+)[\s.\-|:;,]+(?:(.*?)[\s\-|:;,]+)?(DO#|RE#|FA#|SO#|LA#|DO|RE|MI|FA|SO|LA|SI|[A-G]#?)$/i;
    $("bulk").value.split("\n").forEach(function(l){var m=re.exec(l.trim());if(!m||/^[a-g]$/.test(m[3]))return;var r={n:+m[1],t:(m[2]||"").trim(),k:SOL[m[3].toUpperCase()]||m[3].toUpperCase()},ex=find(r.n);if(ex){ex.t=r.t||ex.t;ex.k=r.k}else S.items.push(r);c++});
    save();render();$("iom").textContent=c+" ligne(s) importée(s)."}
});
$("q").addEventListener("input",function(e){S.q=e.target.value;render()});
$("sic").innerHTML=ic("search",18);load();render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
